name: Prepare release
on:
  push:
    branches: [stable]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: getexception-release
  cancel-in-progress: false
jobs:
  prepare-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    steps:
      - name: Require stable and the repository deploy key
        env:
          EVENT_REF: ${{ github.ref }}
          REPOSITORY_SSH_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          test "$EVENT_REF" = refs/heads/stable
          if [ -z "$REPOSITORY_SSH_KEY" ]; then
            echo '::error::Set DEPLOY_KEY to the private repository deploy key with Allow write access.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          ssh-strict: true
          persist-credentials: true
          fetch-depth: 0
      - name: Check repository write access without pushing changes
        run: |
          git fetch origin stable
          if ! git push --dry-run origin refs/remotes/origin/stable:refs/heads/stable; then
            echo '::error::DEPLOY_KEY must match a repository deploy key with Allow write access; stable rules must permit the release commit.'
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn ci:tools
      - run: yarn local:mailpit
      - run: bash scripts/release/install-browser.sh
      - name: Prepare release commit and dispatch its exact SHA
        run: python3 scripts/release/prepare.py
        env:
          SOURCE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
