name: SDK release
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full SHA of the prepared SDK release commit on stable
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: getexception-release
  cancel-in-progress: false
jobs:
  prepare-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reject stale, unprepared or mismatched SDK releases
        env:
          REQUESTED_SHA: ${{ inputs.release_sha }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
        run: |
          test "$EVENT_REF" = refs/heads/stable
          test "$REQUESTED_SHA" = "$EVENT_SHA"
          test "$(git ls-remote origin refs/heads/stable | cut -f1)" = "$EVENT_SHA"
          git log -1 --format=%B | grep -Eq '^Release-Source: [a-f0-9]{40}$'
  checks:
    needs: prepare-release
    uses: ./.github/workflows/checks.yml
  publish-packages:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn generate && yarn build
      - run: python3 scripts/release/check-head.py
      - name: Publish absent SDK versions with provenance and verify existing versions
        run: yarn release:packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          YARN_NPM_PUBLISH_REGISTRY: https://registry.npmjs.org
  registry-smoke:
    needs: publish-packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn generate && yarn build
      - run: yarn release:registry-smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: registry-fixtures
          path: |
            .artifacts/registry/browser-spa/dist
            .artifacts/registry/react-spa/dist
          retention-days: 3
  sdk-e2e:
    needs: registry-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install --immutable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: registry-fixtures
          path: .artifacts/registry
      - run: bash scripts/release/install-browser.sh
      - name: Verify published SDK events in an isolated installation
        run: python3 scripts/release/docker-smoke.py --build --registry-fixtures
